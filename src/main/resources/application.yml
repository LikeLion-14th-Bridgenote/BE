spring:
  application:
    name: bridgenote
  profiles:
    active: dev
  jackson:
    # 요청/응답 JSON은 snake_case (예: expected_count). Java는 camelCase로 작성.
    property-naming-strategy: SNAKE_CASE

# realtime 모듈이 호출하는 AI 서버(bridgenote-AI) 주소
bridgenote:
  ai:
    server-url: ${AI_SERVER_URL:http://localhost:8000}
  # 회의 초대 링크 base URL. 형식: {base}/meetings/{id}
  invite-base-url: ${INVITE_BASE_URL:http://localhost:8080}

# Supabase Auth JWT 검증. 현재 프로젝트 서명키가 비대칭(ES256)이라 공개 JWKS로 검증한다.
# (JWKS는 공개 정보라 커밋해도 됨. 프로젝트가 다르면 env SUPABASE_JWKS_URI 로 덮어쓰기)
supabase:
  jwks-uri: ${SUPABASE_JWKS_URI:https://gvydjaogqafugbcmufdn.supabase.co/auth/v1/.well-known/jwks.json}

# Deepgram STT (실시간 오디오 → 확정 발화). api-key는 env/application-dev.yml 로 주입 — 커밋 금지.
deepgram:
  api-key: ${DEEPGRAM_API_KEY:}
  model: ${DEEPGRAM_MODEL:nova-2}
  language: ${DEEPGRAM_LANGUAGE:multi}
  # raw PCM이면 지정(예: encoding=linear16, sample-rate=16000). webm/ogg 등 컨테이너면 비워두면 자동감지.
  encoding: ${DEEPGRAM_ENCODING:}
  sample-rate: ${DEEPGRAM_SAMPLE_RATE:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
